version: '3.8'

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      SA_PASSWORD: "Your_password123!"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql

  api:
    build: 
      context: .
      dockerfile: MiniSaaSBackend/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__DefaultConnection=Server=db;Database=MiniSaaS_Db;User Id=sa;Password=Your_password123!;TrustServerCertificate=True;
      - Jwt__Key=SuperSecretKeyThatIsVeryLongAndSecure12345!@#
      - Jwt__Issuer=MiniSaaSBackend
      - Jwt__Audience=MiniSaaSClient
    depends_on:
      - db

volumes:
  sqlserver_data:
